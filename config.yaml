df_id: df-wegzugsbesteuerung-calculator
df_name: Wegzugsbesteuerung-Calculator
welle_introduced: welle-43
type: foundation-df
crux-mk: true

default_action:
  description: "Wegzugsbesteuerung-Calculator §6 AStG - Steuer-Hochrechnung (6-7-stellig EUR moeglich) + DBA-DE-USA-Auslegung + Kinder-Freibetraege + Familien-Steuerklassen-Wechsel (Empfehlungs-only mit StBerG §3-Vorbehalt - PFLICHT-Steuerberater-Validierung VOR Action)"
  rho_per_run_eur: 200
  rho_validation_source: unvalidated
  block_gates:
    - gate_id: K13_PAV
      block_reason: "Pre-Action-Verification HARD-PFLICHT bei K_0-DIRECT 6-7-stellig EUR: KEINE Direct-Steuer-Action (Steuerberater-Vorbehalt §3 StBerG) + DBA-Auslegung-Risiko + Q_0-Familien-Steuerklassen"
      false_block_cost_eur: 150
      legitimate_block_condition: "Direct-Steuer-Action-Attempt ohne Steuerberater-Validierung (immer REJECT, §3 StBerG) ODER Production-Mode ohne PHRONESIS_TICKET"
    - gate_id: K14
      block_reason: "Human-Override-Decay: Steuer-Calculator-Output IMMER Martin-Review + Steuerberater-Sign-Off VOR Action"
      false_block_cost_eur: 120
      legitimate_block_condition: "Auto-Action-Trigger ohne Martin+Steuerberater-Sign-Off ODER override_complexity > requires_specialist"
    - gate_id: K11
      block_reason: "Cascade-Containment: Calculator-Output darf KEINEN automatischen Wegzug-Trigger ausloesen"
      false_block_cost_eur: 100
      legitimate_block_condition: "Auto-Wegzug-Trigger detected (immer REJECT)"
  graceful_degradation_path: "Sandbox-Berechnungs-only-Mode mit Mock-Vermoegens-Profile (KEIN Real-Steuer-Filing, nur Hochrechnungs-Display fuer Steuerberater-Review)"

k0_touch: true
q0_touch: true
k0_caveats:
  - "§6 AStG Wegzugssteuer 6-7-stellig EUR moeglich"
  - "Doppelbesteuerungsabkommen DE-USA Auslegungs-Risiko"
  - "Steuerberater-Pflicht (StBerG §3)"
q0_caveats:
  - "Familien-Steuerklassen-Wechsel"
  - "Kinder-Freibetraege Auswirkung"
phronesis_required: true
sandbox_default: true
disclaimer_required: true

cascade_isolation: hard
failure_blast_radius: 1
output_feeds_into_training: false
external_anchor_type: government_data
external_anchor_validation_frequency: quarterly
concurrent_spawn_protection: both
lock_dir: /tmp/df-wegzugsbesteuerung-calculator.lock
lock_stale_age_h: 6

lose_coupling:
  LC1_graceful_degradation:
    degradation_modes: [full, degraded_no_external, sandbox_mock]
    degradation_test_required: true
  LC2_direct_mode:
    direct_mode_available: true
    direct_mode_capability: 0.6
    direct_mode_trigger: "external API unreachable >30s"
  LC3_circuit_breaker:
    circuit_breaker_timeout_s: 30
    circuit_breaker_open_threshold: 3
    circuit_breaker_half_open_test_interval_s: 300
  LC4_failure_isolation:
    state_externalization: true
    idempotent_operations: true
    dependency_dlq_separate: true
  LC5_health_check:
    health_check_dependencies: []
    health_check_degraded_score: 0.7
    health_check_endpoint_or_file: "branch-hub/state/df-wegzugsbesteuerung-calculator-health.json"

env_vars:
  DF_WEGZUG_REAL_ENABLED: "false"
  PHRONESIS_TICKET: "MISSING"

schedule:
  cadence: daily
  time: "04:00"
  timezone: Europe/Berlin
